version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: autodoor-postgres
    environment:
      POSTGRES_DB: autodoor
      POSTGRES_USER: autodoor
      POSTGRES_PASSWORD: ${AUTODOOR_DB_PASSWORD:-autodoor_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autodoor"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: autodoor-api
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5000"
    volumes:
      - autodoor_keys:/app/keys
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: autodoor-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
  autodoor_keys:
