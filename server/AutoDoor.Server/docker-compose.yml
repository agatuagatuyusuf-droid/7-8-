version: '3.8'

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: autodoor
      POSTGRES_USER: autodoor
      POSTGRES_PASSWORD: autodoor_dev_password
    ports:
      - "5432:5432"
    volumes:
      - autodoor_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autodoor"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - AUTODOOR_DB_PROVIDER=PostgreSQL
      - AUTODOOR_DB_CONNECTION_STRING=Host=postgres;Port=5432;Database=autodoor;Username=autodoor;Password=autodoor_dev_password
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  autodoor_postgres_data: