# GitHub Actions - 商业版构建
# 注意：商业包请在 Windows 本地执行 build_commercial.bat 构建。
# GitHub Actions 暂不自动发布商业包，避免误发布未授权版本。

name: AutoDoor Pro CI

on:
  workflow_dispatch:
    inputs:
      run_checks:
        description: 'Run build checks only (no release)'
        required: false
        default: 'true'

env:
  PYTHON_VERSION: '3.12'

jobs:
  check:
    name: Code Quality Check
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        fetch-tags: true

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Python compile check
      run: |
        python -m compileall main.py bt_core bt_gui bt_nodes bt_utils config bt_bridge

    - name: Check no source code leakage
      run: |
        python tools/check_dist_no_source.py . --no-dist

    - name: Check author info cleanup
      shell: pwsh
      run: |
        $matches = Select-String -Path "*.py","*.md","*.txt","*.json","*.bat" -Pattern "wdhq4261761|298117299|QQ群|B站|bilibili|space.bilibili.com|my.feishu.cn" -SimpleMatch
        if ($matches) {
          Write-Host "ERROR: Found author info remaining:"
          $matches | ForEach-Object { Write-Host $_.Filename $_.LineNumber }
          exit 1
        }
        Write-Host "OK: No author info remaining"
